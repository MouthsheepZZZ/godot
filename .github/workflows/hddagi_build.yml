name: 🔨 HDDAGI Windows Build
on:
  workflow_dispatch:
  push:
    branches: [hddagi-4.7]

env:
  SCONS_FLAGS: dev_mode=yes debug_symbols=no
  SCONS_CACHE_MSVC_CONFIG: true

jobs:
  build-windows:
    runs-on: windows-latest
    name: Windows Editor
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: windows-editor-hddagi
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: SCons Build
        shell: sh
        run: |
          scons platform=windows target=editor \
            ${{ env.SCONS_FLAGS }} \
            "cache_path=${{ github.workspace }}/.scons_cache/" \
            redirect_build_objects=no
          ls -l bin/

      - name: Upload Godot Artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: godot-windows-editor-hddagi
          path: bin/godot.windows.editor.x86_64*

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: windows-editor-hddagi
